# Roles -> provider + model. Agents ask for a role, never a model name.
# Model IDs are editable; check current IDs/pricing before changing.
default_provider: anthropic
providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  openai:
    api_key_env: OPENAI_API_KEY
    enabled: false
roles:
  planner:   { provider: anthropic, model: claude-sonnet-5-5 }   # calendar, series plans
  writer:    { provider: anthropic, model: claude-sonnet-5-5 }   # scripts, captions
  editor:    { provider: anthropic, model: claude-sonnet-5-5 }   # clip ordering suggestions
  tagger:    { provider: anthropic, model: claude-haiku-5-5 }    # bulk frame tagging (cheap)
  reviewer:  { provider: anthropic, model: claude-opus-5-5 }     # optional final quality pass
